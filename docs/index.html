<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API-using-sockets-and-servlets</title>
  <meta name="description" content="API using sockets and serlvets with jetty server">
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f6f5f2;
      --ink: #1c1917;
      --mute: #57534e;
      --accent: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161412;
        --ink: #f5f5f4;
        --mute: #a8a29e;
        --accent: #93c5fd;
      }
    }
    * { box-sizing: border-box; }
    html {
      background: var(--paper);
      color: var(--ink);
      font: 1.05rem/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    body { margin: 0; }
    main { width: min(40rem, 100% - 2.5rem); margin: 0 auto; padding: 3rem 0; }
    h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 0.5rem; }
    p { color: var(--mute); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>API-using-sockets-and-servlets</h1>
    <p>API using sockets and serlvets with jetty server</p>
    <p><a href="https://github.com/YauhenBichel/API-using-sockets-and-servlets">View on GitHub</a></p>
  </main>
</body>
</html>
